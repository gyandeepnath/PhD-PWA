    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /*
     * Root scaling strategy — the ONLY correct approach for a full-viewport
     * tablet app with mixed px/fixed layouts:
     *
     * 1. html/body fill the physical CSS viewport exactly — no zoom, no transform here.
     * 2. #root is scaled via transform:scale() using --vl-scale CSS variable.
     * 3. When scale < 1, #root's layout dimensions are expanded inversely
     *    (width: calc(100% / var(--vl-scale))) so the content area fills the
     *    viewport even after scaling down, preventing clipping.
     * 4. transform-origin: top left ensures alignment is correct.
     * 5. All position:fixed children are contained within #root's stacking
     *    context — so they scale correctly with the content.
     *
     * This avoids:
     *   - CSS zoom (changes fixed-element coordinate system on Android Chrome)
     *   - transform:scale on document.documentElement (breaks 100dvh calculations)
     *   - font-size scaling (would require rem on all 400+ inline px values)
     */
    :root {
      --vl-scale: 1;
    }

    html {
      width: 100%;
      height: 100%;
      /* Do NOT set overflow:hidden here — let #root manage its own clipping */
      overscroll-behavior: none;
    }

    body {
      width: 100%;
      height: 100%;
      background: #F8F7F5;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none;
         -moz-user-select: none;
              user-select: none;
      overscroll-behavior: none;
      overflow: hidden;
    }

    #root {
      /* Scale the entire app from the top-left corner */
      transform-origin: top left;
      transform: scale(var(--vl-scale));

      /*
       * Counter-expand width/height so that at scale 0.8 the layout
       * area is 100/0.8 = 125% — filling the full viewport.
       * position:fixed children within #root are clipped to this area,
       * which after scaling matches the viewport exactly.
       */
      width:  calc(100% / var(--vl-scale));
      height: calc(100% / var(--vl-scale));

      background: #F8F7F5;
      overflow: hidden;

      /* Isolate stacking context so position:fixed inside works */
      isolation: isolate;
    }

    /* Range input — consistent across Android Chrome */
    input[type=range] {
      -webkit-appearance: none; -moz-appearance: none; appearance: none;
      width: 100%; height: 6px; border-radius: 3px; outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; appearance: none;
      width: 24px; height: 24px; border-radius: 50%;
      background: currentColor; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.4);
    }
    input[type=range]::-moz-range-thumb {
      width: 24px; height: 24px; border-radius: 50%;
      background: currentColor; cursor: pointer; border: none;
    }

    /* Scrollable containers within the app */
    .scrollable { overflow-y: auto; -webkit-overflow-scrolling: touch; }

In the atmosphere, carbon exists primarily as carbon dioxide. Plants absorb this gas during photosynthesis, converting it into organic compounds that form their leaves, stems, and roots. Animals then consume plants, incorporating that carbon into their own tissues. When organisms die, decomposers break down organic matter and release carbon dioxide back into the atmosphere.`,`Oceans play a critical role in the carbon cycle. Seawater absorbs large quantities of atmospheric carbon dioxide, where it dissolves and reacts with water to form carbonic acid. Marine organisms use dissolved carbon to build shells and skeletons. When these creatures die, their remains sink to the ocean floor, gradually forming limestone and chalk deposits over millions of years.

Human activities have significantly altered the carbon cycle. Burning fossil fuels releases carbon that was stored underground for millions of years, adding it to the atmosphere far faster than natural processes can absorb it. Deforestation reduces the number of trees available to absorb carbon dioxide, compounding the imbalance. Scientists continue to study these disruptions to develop strategies for restoring equilibrium.`]},{passage_id:1,word_count:285,title:"Ocean Currents",pages:[`Ocean currents are continuous, directed movements of water flowing through the world's seas. These currents are driven by a combination of wind, differences in water density, Earth's rotation, and the shape of ocean basins. Together they form a global circulation system that distributes heat, nutrients, and dissolved gases around the planet.

Surface currents are primarily driven by wind patterns. The trade winds near the equator push warm tropical water westward, while westerly winds at higher latitudes drive water in the opposite direction. These movements create large rotating systems called gyres, which dominate the major ocean basins.`,`Deep ocean currents operate through a different mechanism known as thermohaline circulation. When surface water in polar regions becomes cold and dense, it sinks and spreads slowly along the ocean floor. This cold, deep water gradually warms as it travels toward the equator, eventually rising back to the surface in a process called upwelling. This vertical movement brings nutrients from the deep ocean to the surface, supporting productive marine ecosystems.

Ocean currents have a profound influence on climate. The Gulf Stream carries warm water from the Gulf of Mexico northward along the eastern coast of North America and across to western Europe, moderating temperatures significantly. Without this current, northwestern Europe would experience far colder winters. Disruption of these circulation patterns due to climate change could have serious consequences for regional climates worldwide.`]},{passage_id:2,word_count:292,title:"The Human Immune System",pages:[`The immune system is the body's defence network, protecting against bacteria, viruses, fungi, and other harmful substances. It operates through a complex series of biological processes involving specialised cells, tissues, and organs working in coordination to identify and eliminate threats.

The first line of defence consists of physical and chemical barriers. Skin forms a protective outer layer that prevents most pathogens from entering the body. Mucous membranes lining the respiratory and digestive tracts trap particles and contain antimicrobial substances. Stomach acid destroys many bacteria that enter through food or drink.`,`When pathogens breach these initial barriers, the innate immune system responds rapidly. White blood cells called neutrophils and macrophages engulf and destroy foreign invaders through a process called phagocytosis. Inflammation is triggered at the site of infection, increasing blood flow and attracting more immune cells to the area.

The adaptive immune system provides a more precise and targeted defence. Specialised cells called lymphocytes recognise specific molecules on the surface of pathogens, known as antigens. B lymphocytes produce proteins called antibodies that bind to these antigens, neutralising the pathogen or marking it for destruction. T lymphocytes coordinate the immune response and directly kill infected cells. Crucially, the adaptive immune system retains a memory of previous infections, allowing faster and more effective responses upon re-exposure. This principle underlies vaccination, where a harmless form of a pathogen is introduced to generate protective immunity without causing disease.`]},{passage_id:3,word_count:276,title:"Volcanic Eruptions",pages:[`Volcanoes are openings in Earth's crust through which molten rock, gases, and ash can escape from the interior of the planet. They occur along tectonic plate boundaries and above areas known as hotspots, where plumes of hot mantle material rise toward the surface. Volcanic eruptions range from gentle lava flows to catastrophic explosions with global consequences.

The behaviour of a volcano depends largely on the composition of its magma. Magma with low silica content is relatively fluid and allows gases to escape easily, resulting in effusive eruptions where lava flows steadily across the landscape. Hawaiian volcanoes typically behave this way, producing rivers of lava that cool slowly as they spread.`,`High-silica magma is far more viscous, trapping gases under pressure. When this pressure becomes sufficient, the result is an explosive eruption that can launch ash and rock fragments high into the atmosphere. The 1980 eruption of Mount St Helens in the United States and the 1883 eruption of Krakatoa in Indonesia are examples of such violent events. Large explosive eruptions can inject enough material into the upper atmosphere to temporarily lower global temperatures.

Despite their destructive power, volcanoes have played a vital role in shaping Earth. They release gases that contributed to the formation of the early atmosphere and oceans. Volcanic soils are exceptionally fertile, supporting productive agriculture. Geothermal energy from volcanic regions provides renewable electricity in countries such as Iceland and New Zealand. Scientists monitor active volcanoes continuously to improve understanding and provide advance warning of eruptions.`]},{passage_id:4,word_count:281,title:"The Science of Sleep",pages:[`Sleep is a fundamental biological process that is essential for physical health, cognitive function, and emotional regulation. During sleep, the brain and body perform critical maintenance tasks that cannot occur during waking hours. Despite spending approximately one third of our lives asleep, the precise functions of sleep are still being investigated by scientists.

Sleep is not a uniform state but consists of distinct cycles that repeat throughout the night. Each cycle lasts approximately ninety minutes and includes stages of non-rapid eye movement sleep and rapid eye movement sleep. During the deeper stages of non-rapid eye movement sleep, the body repairs tissues, synthesises proteins, and releases growth hormones.`,`Rapid eye movement sleep is associated with vivid dreaming and plays a central role in memory consolidation and emotional processing. During this stage, the brain replays and reorganises experiences from the preceding day, transferring information from short-term to long-term memory. Research has shown that people who sleep well after learning a new skill perform significantly better than those who are sleep deprived.

Chronic sleep deprivation has serious health consequences. It impairs concentration, reaction time, and decision-making, and has been linked to increased risk of cardiovascular disease, diabetes, and obesity. The brain's glymphatic system, which clears metabolic waste products, functions primarily during sleep. Disruption of this cleaning process has been associated with the accumulation of proteins linked to Alzheimer's disease. Public health authorities increasingly recognise adequate sleep as essential to overall wellbeing, alongside diet and physical activity.`]},{passage_id:5,word_count:283,title:"Rainforest Ecosystems",pages:[`Tropical rainforests are among the most biologically diverse ecosystems on Earth, covering approximately six percent of the planet's land surface yet harbouring more than half of all known plant and animal species. These dense forests are found near the equator, where warm temperatures and high rainfall create ideal conditions for extraordinary biodiversity.

The structure of a rainforest is organised into distinct vertical layers. The emergent layer consists of the tallest trees, reaching heights of fifty metres or more, their canopies exposed to full sunlight and wind. Below lies the main canopy, a dense continuous layer of treetops where most photosynthesis occurs and where the majority of animal species live.`,`The understorey is a shaded zone beneath the canopy where smaller trees and shrubs are adapted to low light conditions. At ground level, the forest floor receives very little sunlight and is dominated by fungi, insects, and decomposers that rapidly break down fallen leaves and dead organisms. This decomposition releases nutrients that are quickly absorbed by the shallow root systems of rainforest trees.

Rainforests play an indispensable role in regulating Earth's climate. They absorb vast quantities of carbon dioxide and release oxygen, acting as critical carbon sinks. The transpiration of water vapour from tree leaves contributes to regional rainfall patterns, sustaining agriculture across wide areas. Despite their importance, tropical rainforests are being lost at an alarming rate due to deforestation for agriculture, logging, and infrastructure. Conservation efforts focus on protecting remaining forest and restoring degraded land.`]},{passage_id:6,word_count:279,title:"Plate Tectonics",pages:[`Plate tectonics is the scientific theory that describes the movement of large sections of Earth's outer shell, called tectonic plates, and explains many geological features including mountains, earthquakes, and volcanoes. The theory revolutionised Earth science when it was established in the 1960s, providing a unifying framework that connected previously separate observations.

Earth's outermost layer, the lithosphere, is divided into approximately fifteen major plates and several smaller ones. These plates float on the partially molten rock of the asthenosphere and move at rates of a few centimetres per year, driven by convection currents in the mantle below.`,`Plates interact at their boundaries in three primary ways. At convergent boundaries, plates move toward each other. When an oceanic plate meets a continental plate, the denser oceanic plate is forced beneath the continental plate in a process called subduction, creating deep ocean trenches and volcanic mountain chains. When two continental plates collide, neither subducts, and the collision produces vast mountain ranges such as the Himalayas.

At divergent boundaries, plates move apart and new oceanic crust is created as magma rises from below to fill the gap. The Mid-Atlantic Ridge is a prominent example of this process, where the North American and Eurasian plates are separating at roughly two centimetres per year. At transform boundaries, plates slide horizontally past each other, generating earthquakes along major fault lines such as the San Andreas Fault in California. The slow but relentless movement of tectonic plates has shaped the continents and oceans over hundreds of millions of years.`]},{passage_id:7,word_count:274,title:"Light and the Electromagnetic Spectrum",pages:[`Light is a form of electromagnetic radiation, a type of energy that travels as waves through space. What we perceive as visible light is only a small portion of a much broader electromagnetic spectrum that includes radio waves, microwaves, infrared radiation, ultraviolet light, X-rays, and gamma rays. These different forms of radiation share the same fundamental nature but differ in wavelength and frequency.

The electromagnetic spectrum is arranged by wavelength, which is the distance between successive wave peaks. Radio waves have the longest wavelengths, stretching from millimetres to hundreds of kilometres. Gamma rays have the shortest wavelengths, smaller than the diameter of an atomic nucleus.`,`Visible light occupies a narrow band of wavelengths between approximately 380 and 700 nanometres. Within this range, different wavelengths correspond to different colours. Violet light has the shortest wavelength and highest frequency, while red light has the longest wavelength and lowest frequency. White light contains all visible wavelengths, which is why passing it through a prism produces a rainbow of colours.

The speed of light in a vacuum is approximately 300,000 kilometres per second, one of the most important constants in physics. When light passes through different materials, it slows down and can bend, a phenomenon called refraction. This bending of light by the atmosphere causes mirages in hot conditions and makes stars appear to twinkle near the horizon. The study of light and optics has led to transformative technologies including photography, fibre optic communications, lasers, and medical imaging devices.`]}],B0=[{passage_id:0,question:"According to the passage, what happens to carbon when organisms die?",correct_index:2,options:["It is absorbed by oceans","It sinks to the ocean floor","Decomposers release it back as CO₂","It forms fossil fuels immediately"]},{passage_id:1,question:"What is the term for the rising of deep, cold ocean water toward the surface?",correct_index:1,options:["Thermohaline circulation","Upwelling","Convection","Gyration"]},{passage_id:2,question:"What do B lymphocytes produce to defend against pathogens?",correct_index:0,options:["Antibodies","Phagocytes","Antigens","Neutrophils"]},{passage_id:3,question:"What property of magma primarily determines whether a volcanic eruption is explosive?",correct_index:3,options:["Temperature","Volume","Depth below surface","Silica content"]},{passage_id:4,question:"What system in the brain clears metabolic waste products, primarily during sleep?",correct_index:1,options:["The limbic system","The glymphatic system","The reticular system","The prefrontal cortex"]},{passage_id:5,question:"Approximately what percentage of all known plant and animal species are found in tropical rainforests?",correct_index:2,options:["Six percent","Twenty-five percent","More than fifty percent","Thirty percent"]},{passage_id:6,question:"What occurs at a divergent plate boundary?",correct_index:0,options:["New oceanic crust is created as plates move apart","One plate subducts beneath another","Plates slide horizontally past each other","Mountain ranges are formed"]},{passage_id:7,question:"Which type of light has the shortest wavelength within the visible spectrum?",correct_index:3,options:["Red","Green","Yellow","Violet"]}],L0=[{passage_id:0,target_word:"carbon",target_count:8,text:`Find all occurrences of the word "carbon" in the text below.
