<svg viewBox="0 0 760 300" role="img" aria-label="Within-subjects design: one participant attends a single sitting at a constant 300 lux and sees all ten polarity-by-colour display conditions, giving ten condition-runs per person.">
  <g font-family="system-ui,sans-serif" font-size="12" fill="currentColor">
    <rect x="300" y="12" width="160" height="36" rx="18" fill="none" style="stroke:var(--accent)" stroke-width="1.8"/>
    <text x="380" y="35" text-anchor="middle" font-weight="650" font-size="12.5">one participant</text>
    <path d="M380,48 L380,72" fill="none" stroke="currentColor" stroke-width="1.3" marker-end="url(#ar)"/>

    <rect x="90" y="74" width="580" height="196" rx="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="5 3" opacity=".8"/>
    <text x="380" y="95" text-anchor="middle" font-weight="650">single sitting &#183; ambient held at 300 lux</text>
    <text x="380" y="112" text-anchor="middle" font-size="10.5" opacity=".75">illumination is controlled, not manipulated &#8212; it has no levels to cross</text>

    <text x="380" y="136" text-anchor="middle" font-size="10.5" font-weight="600">positive polarity &#183; dark text on light</text>
    <g font-size="10">
      <rect x="120" y="144" width="94" height="30" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="167" y="163" text-anchor="middle" fill="#111">P1 achrom.</text>
      <rect x="222" y="144" width="94" height="30" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="269" y="163" text-anchor="middle" fill="#1E4ED8">P2 blue</text>
      <rect x="324" y="144" width="94" height="30" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="371" y="163" text-anchor="middle" fill="#C81E1E">P3 red</text>
      <rect x="426" y="144" width="94" height="30" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="473" y="163" text-anchor="middle" fill="#C9A400">P4 yellow</text>
      <rect x="528" y="144" width="94" height="30" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/><text x="575" y="163" text-anchor="middle" fill="#00A651">P5 green</text>
    </g>

    <text x="380" y="196" text-anchor="middle" font-size="10.5" font-weight="600">negative polarity &#183; light text on dark</text>
    <g font-size="10">
      <rect x="120" y="204" width="94" height="30" rx="4" fill="#000000" stroke="#333" stroke-width="1"/><text x="167" y="223" text-anchor="middle" fill="#ffffff">N1 achrom.</text>
      <rect x="222" y="204" width="94" height="30" rx="4" fill="#000000" stroke="#333" stroke-width="1"/><text x="269" y="223" text-anchor="middle" fill="#6E9BFF">N2 blue</text>
      <rect x="324" y="204" width="94" height="30" rx="4" fill="#000000" stroke="#333" stroke-width="1"/><text x="371" y="223" text-anchor="middle" fill="#F06A6A">N3 red</text>
      <rect x="426" y="204" width="94" height="30" rx="4" fill="#000000" stroke="#333" stroke-width="1"/><text x="473" y="223" text-anchor="middle" fill="#C9A400">N4 yellow</text>
      <rect x="528" y="204" width="94" height="30" rx="4" fill="#000000" stroke="#333" stroke-width="1"/><text x="575" y="223" text-anchor="middle" fill="#00A651">N5 green</text>
    </g>

    <text x="380" y="256" text-anchor="middle" font-size="10.5" opacity=".8">presented in Williams order &#183; each of the ten passages read exactly once</text>
    <text x="380" y="288" text-anchor="middle" font-weight="650" font-size="12.5">10 condition-runs per participant &#183; 1,300 across the study</text>
  </g>
</svg>
