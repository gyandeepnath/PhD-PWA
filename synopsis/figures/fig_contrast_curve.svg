<svg viewBox="0 0 720 430" role="img" aria-label="Contrast ratio plotted against text relative luminance. The curve for a white background falls steeply while the line for a black background rises linearly, so the five text colours occupy exactly reversed rank orders in the two polarities.">
  <g font-family="system-ui,sans-serif" font-size="11" fill="currentColor">
    <line x1="70" y1="40" x2="70" y2="340" stroke="currentColor" stroke-width="1.2"/>
    <line x1="70" y1="340" x2="662" y2="340" stroke="currentColor" stroke-width="1.2"/>

    <g opacity=".28" stroke="currentColor" stroke-width=".8" stroke-dasharray="2 3">
      <line x1="70" y1="280" x2="660" y2="280"/><line x1="70" y1="205" x2="660" y2="205"/><line x1="70" y1="130" x2="660" y2="130"/>
    </g>
    <g text-anchor="end" font-family="ui-monospace,monospace" font-size="9.5" opacity=".7">
      <text x="63" y="344">1:1</text><text x="63" y="284">5:1</text><text x="63" y="209">10:1</text><text x="63" y="134">15:1</text><text x="63" y="44">21:1</text>
    </g>
    <text x="20" y="196" font-size="10" letter-spacing="1" transform="rotate(-90 20 196)" text-anchor="middle" opacity=".7">WCAG CONTRAST RATIO</text>

    <g text-anchor="middle" font-family="ui-monospace,monospace" font-size="9.5" opacity=".7">
      <text x="70" y="356">0</text><text x="217" y="356">0.25</text><text x="365" y="356">0.50</text><text x="512" y="356">0.75</text><text x="660" y="356">1.0</text>
    </g>
    <text x="365" y="376" text-anchor="middle" font-size="10" letter-spacing="1" opacity=".7">RELATIVE LUMINANCE OF THE TEXT COLOUR &nbsp;→&nbsp; LIGHTER</text>

    <line x1="70" y1="287.5" x2="660" y2="287.5" stroke="currentColor" stroke-width="1.2" stroke-dasharray="6 4" opacity=".65"/>
    <text x="666" y="291" font-family="ui-monospace,monospace" font-size="9" opacity=".75">AA 4.5</text>
    <line x1="70" y1="250" x2="660" y2="250" stroke="currentColor" stroke-width="1" stroke-dasharray="6 4" opacity=".4"/>
    <text x="666" y="253" font-family="ui-monospace,monospace" font-size="9" opacity=".55">AAA 7</text>

    <polyline points="70,40 99.5,197.5 129,250 158.5,276.3 188,292 217.5,302.5 247,310 276.5,315.6 306,320 365,326.4 424,330.8 483,334 542,336.5 601,338.4 660,340"
      fill="none" stroke="currentColor" stroke-width="2.4"/>
    <line x1="70" y1="340" x2="660" y2="40" style="stroke:var(--accent)" stroke-width="2.4"/>

    <text x="150" y="140" font-size="11.5" font-weight="650">text on a WHITE background</text>
    <text x="150" y="156" font-size="10.5" opacity=".7">falls as text gets lighter</text>
    <line x1="146" y1="146" x2="112" y2="200" stroke="currentColor" stroke-width="1" opacity=".5"/>

    <text x="452" y="112" font-size="11.5" font-weight="650" style="fill:var(--accent)">text on a BLACK background</text>
    <text x="452" y="128" font-size="10.5" opacity=".7">rises as text gets lighter</text>
    <line x1="500" y1="136" x2="520" y2="168" style="stroke:var(--accent)" stroke-width="1" opacity=".6"/>

    <circle cx="175.7" cy="286.3" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>

    <g stroke="#FFFFFF" stroke-width="1.4">
      <circle cx="70" cy="40" r="6" fill="#000000"/>
      <circle cx="133" cy="254.5" r="6" fill="#1E4ED8"/>
      <circle cx="148.5" cy="268.9" r="6" fill="#C81E1E"/>
      <circle cx="234.5" cy="307.2" r="6" fill="#00A651"/>
      <circle cx="300" cy="319.2" r="6" fill="#C9A400"/>
      <circle cx="70" cy="340" r="6" fill="#000000"/>
      <circle cx="133" cy="307.9" r="6" fill="#1E4ED8"/><line x1="126" y1="313" x2="118" y2="320" stroke="#8E88A0" stroke-width="1"/>
      <circle cx="148.5" cy="300.1" r="6" fill="#C81E1E"/>
      <circle cx="234.5" cy="256.5" r="6" fill="#00A651"/>
      <circle cx="300" cy="223.2" r="6" fill="#C9A400"/>
      <circle cx="660" cy="40" r="6" fill="#FFFFFF" stroke="#8E88A0"/>
      <circle cx="660" cy="340" r="6" fill="#FFFFFF" stroke="#8E88A0"/>
    </g>

    <g font-family="ui-monospace,monospace" font-size="9" fill="currentColor" style="paint-order:stroke;stroke:var(--surface);stroke-width:3.4;stroke-linejoin:round">
      <text x="80" y="34">black 21.00</text>
      <text x="142" y="244">blue 6.70</text>
      <text x="160" y="274">red 5.74</text>
      <text x="244" y="313">green 3.19</text>
      <text x="310" y="309">yellow 2.39</text>
      <text x="120" y="324" text-anchor="end">blue 3.14</text>
      <text x="140" y="296" text-anchor="end">red 3.66</text>
      <text x="244" y="250">green 6.57</text>
      <text x="310" y="217">yellow 8.79</text>
      <text x="600" y="34" text-anchor="end">white 21.00</text>
    </g>

    <text x="70" y="404" font-size="11" font-weight="650">On white, best → worst:</text>
    <text x="228" y="404" font-size="11" font-family="ui-monospace,monospace">black · blue · red · green · yellow</text>
    <text x="70" y="422" font-size="11" font-weight="650" style="fill:var(--accent)">On black, best → worst:</text>
    <text x="228" y="422" font-size="11" font-family="ui-monospace,monospace" style="fill:var(--accent)">white · yellow · green · red · blue</text>
  </g>
</svg>